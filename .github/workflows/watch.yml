name: Trump post watch
on:
  schedule:
    # every 5 min weekdays 11:03-19:58 UTC  (= 7:03am-3:58pm ET in daylight time, 6:03am-2:58pm ET in winter)
    # off-peak minutes (:03, :08, :13 ...) on purpose: GitHub delays or drops runs most at :00/:05/:15, when its servers are busiest
    - cron: "3-58/5 11-19 * * 1-5"
    # every 15 min the rest of the time (nights, weekends)
    - cron: "7-52/15 0-10,20-23 * * 1-5"
    - cron: "7-52/15 * * * 0,6"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test push to the phone"
        type: boolean
        default: false
concurrency:
  group: trump-watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Truth Social and push alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PHONE_MIN_HEAT: ${{ vars.PHONE_MIN_HEAT || '3' }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then python watcher.py --test; else python watcher.py; fi
      - name: Save state and log
        run: |
          git config user.name "trump-watch-bot"
          git config user.email "trump-watch-bot@users.noreply.github.com"
          for f in state.json alert_log.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "watch $(date -u +%H:%M)" && git push)
